name: Build Windows (VST3 + Standalone)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target FourRealAudio_VST3 FourRealAudio_Standalone --parallel

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/FourRealAudio_artefacts/Release/VST3/*" dist/
          Copy-Item -Recurse -Force "build/FourRealAudio_artefacts/Release/Standalone/*" dist/
          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: 4real-audio-windows-x64
          path: dist
