name: Build Windows (VST3 + Standalone)

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "docs/**"
      - "training/**"
      - "**.md"
  workflow_dispatch:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run DSP + spectral engine tests
        run: |
          g++ -std=c++20 -O2 -ISource/dsp tests/dsp_test.cpp Source/dsp/GuitarCircuit.cpp Source/dsp/GuitarModels.cpp Source/dsp/FilterDesign.cpp -o dsp_test
          ./dsp_test
          g++ -std=c++20 -O2 -ISource/dsp tests/spm_test.cpp Source/dsp/SpecModel.cpp Source/dsp/SpecEngine.cpp -o spm_test
          for c in LP STR FLC; do ./spm_test models/$c/model.spm tests/golden/golden_spm_$c.json; done
          for c in 335 SG PRS RIC TCR; do test -s models/$c/model.spm; done
          g++ -std=c++20 -O2 -ISource/dsp tests/library_test.cpp Source/dsp/GuitarModels.cpp Source/dsp/GuitarCircuit.cpp Source/dsp/FilterDesign.cpp Source/dsp/SpecModel.cpp -o library_test
          ./library_test models

  build:
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3 and Standalone (one plugin, the whole guitar library)
        run: cmake --build build --config Release --target FourReal_VST3 FourReal_Standalone --parallel

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/FourReal_artefacts/Release/VST3/*" dist/
          Copy-Item -Recurse -Force "build/FourReal_artefacts/Release/Standalone/*" dist/
          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: 4real-audio-windows-x64-TEST-unlocked
          path: dist

  # Release build: guitars are LOCKED until the signed-in account owns them (see server/README.md).
  # Only PUBLIC values are here: the server URL, the Supabase publishable (anon) key and the Ed25519 PUBLIC key.
  # The private signing key lives only in the Supabase secret LICENSE_SIGNING_KEY.
  build-release:
    needs: dsp-tests
    runs-on: windows-latest
    env:
      LICENSE_API_URL: "https://kzyyqshqaripdlderkoa.supabase.co"
      LICENSE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6eXlxc2hxYXJpcGRsZGVya29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMjA4NTksImV4cCI6MjEwOTU5Njg1OX0.foH4KJKuR6NxBxd8HMda3nL8A6fY8PTD7ao-bI0-ZLQ"
      LICENSE_PUBLIC_KEY: "ARjJdtOGzxIV5VV5ycCdNpVBBfftAKgmG-7WgJov9CE"
    steps:
      - uses: actions/checkout@v4

      - name: Configure (licence enforced)
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DFOURREAL_ENFORCE_LICENSE=ON" "-DFOURREAL_LICENSE_API_URL=$env:LICENSE_API_URL" "-DFOURREAL_LICENSE_ANON_KEY=$env:LICENSE_ANON_KEY" "-DFOURREAL_LICENSE_PUBLIC_KEY=$env:LICENSE_PUBLIC_KEY" "-DFOURREAL_LICENSE_ACCOUNT_URL=https://3ffect.my.id"

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target FourReal_VST3 FourReal_Standalone --parallel

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/FourReal_artefacts/Release/VST3/*" dist/
          Copy-Item -Recurse -Force "build/FourReal_artefacts/Release/Standalone/*" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: 4real-audio-windows-x64-RELEASE-locked
          path: dist
